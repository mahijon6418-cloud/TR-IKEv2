name: Build M30 - strongSwan

on:
  workflow_dispatch:

jobs:
  build:
    name: Build M30 Android
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            bison \
            flex \
            gperf \
            perl \
            python3 \
            jq \
            make

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          echo "Android SDK: OK"
          echo "Android NDK: OK"

      - name: Clone strongSwan
        run: |
          git clone --depth 1 \
            https://github.com/strongswan/strongswan.git \
            strongswan

      - name: Prepare strongSwan
        working-directory: strongswan
        run: |
          ./autogen.sh
          ./configure
          make dist

      - name: Build OpenSSL for Android
        working-directory: strongswan
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.3.13750724
        run: |
          git clone --depth 1 \
            https://github.com/openssl/openssl.git \
            openssl

          export OPENSSL_SRC="$PWD/openssl"
          export NO_DOCKER=1

          chmod +x src/frontends/android/openssl/build.sh
          src/frontends/android/openssl/build.sh

      - name: Build M30 APK
        working-directory: strongswan/src/frontends/android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.3.13750724
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find strongswan/src/frontends/android \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M30-strongSwan-base
          path: |
            strongswan/src/frontends/android/app/build/outputs/apk/**/*.apk
