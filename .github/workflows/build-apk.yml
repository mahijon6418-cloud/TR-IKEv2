name: Build TR IKEv2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q TR_IKEv2_Client_v1.1.zip -d android-project

      - name: Build Debug APK
        working-directory: android-project
        run: |
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk \
             TR-IKEv2-v1.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TR-IKEv2-v1.1-APK
          path: TR-IKEv2-v1.1-debug.apk
          retention-days: 30
