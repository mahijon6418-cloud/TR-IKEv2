name: Build TR IKEv2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Find latest project ZIP
        id: project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'TR_IKEv2_Client_*.zip' | sort -V | tail -n 1)
          echo "Using: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q "${{ steps.project.outputs.zip }}" -d android-project

      - name: Build Debug APK
        working-directory: android-project
        run: |
          gradle \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            assembleDebug \
            --no-daemon

      - name: Rename APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk \
             TR-IKEv2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TR-IKEv2-APK
          path: TR-IKEv2-debug.apk
          retention-days: 30
