name: Build M30 - real strongSwan IKEv2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build M30 Android
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout M30 repo
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip zip build-essential autoconf automake libtool \
            pkg-config gettext bison flex gperf perl python3 jq make \
            libssl-dev

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK + NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.3.13750724'
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        run: |
          java -version
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0|ndk;27.3.13750724|platform-tools'
          test -x "$ANDROID_NDK_ROOT/ndk-build"

      - name: Clone official strongSwan source
        run: |
          git clone --depth 1 https://github.com/strongswan/strongswan.git strongswan

      - name: Prepare official strongSwan source
        working-directory: strongswan
        run: |
          ./autogen.sh
          ./configure
          make dist

      - name: Build OpenSSL static library for Android
        working-directory: strongswan
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          NO_DOCKER: '1'
        run: |
          git clone --depth 1 --branch openssl-3.5.4 https://github.com/openssl/openssl.git openssl
          export OPENSSL_SRC="$PWD/openssl"
          chmod +x src/frontends/android/openssl/build.sh
          src/frontends/android/openssl/build.sh

      - name: Inject M30 custom UI/controller
        env:
          M30_ROOT: ${{ github.workspace }}
        run: |
          APP="strongswan/src/frontends/android/app"
          JAVA="$APP/src/main/java/org/strongswan/android/ui/M30Activity.java"
          RES="$APP/src/main/res"
          mkdir -p "$(dirname "$JAVA")"

          cp "$M30_ROOT/m30/M30Activity.java" "$JAVA"
          cp "$M30_ROOT/m30/m30_strings.xml" "$RES/values/m30_strings.xml"
          cp "$M30_ROOT/m30/m30_colors.xml" "$RES/values/m30_colors.xml"
          cp "$M30_ROOT/m30/m30_themes.xml" "$RES/values/m30_themes.xml"

          # Make M30 the only launcher screen. The strongSwan engine/services remain intact.
          sed -i 's#android:name=".ui.MainActivity"#android:name=".ui.M30Activity"#' \
            "$APP/src/main/AndroidManifest.xml"

          # Brand the application as M30.
          sed -i 's#<string name="app_name">strongSwan VPN Client</string>#<string name="app_name">M30</string>#' \
            "$APP/src/main/res/values/strings.xml" || true

      - name: Build M30 APK with real strongSwan engine
        working-directory: strongswan/src/frontends/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        run: |
          find strongswan/src/frontends/android/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload M30 APK
        uses: actions/upload-artifact@v4
        with:
          name: M30-real-strongSwan-IKEv2
          path: strongswan/src/frontends/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
